    <rect x="36" y="100" width="40" height="44" rx="2" fill="#fffdf4" stroke="#1b1b1b" stroke-width="2.2"/>
    <path d="M40 100 v-4 M47 100 v-4 M54 100 v-4 M61 100 v-4 M68 100 v-4" stroke="#1b1b1b" stroke-width="2"/>
    <path d="M42 112 h28 M42 119 h24 M42 126 h27 M42 133 h18" stroke="#7a8fc4" stroke-width="1.6"/>
  </g>
