  <g transform="rotate(-35 84 112)">
    <rect x="80" y="96" width="6" height="30" fill="#f4c430" stroke="#1b1b1b" stroke-width="1.5"/>
    <path d="M80 126 L83 133 L86 126 Z" fill="#e8c9a0" stroke="#1b1b1b" stroke-width="1.2"/>
    <rect x="80" y="93" width="6" height="4" fill="#e58a9a" stroke="#1b1b1b" stroke-width="1.2"/>
  </g>
  <ellipse cx="80" cy="124" rx="8" ry="7" fill="{{ fur }}" stroke="#1b1b1b" stroke-width="2"/>
</svg>
