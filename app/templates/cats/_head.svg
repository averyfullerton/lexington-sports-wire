{# Shared cat head + press hat. Expects: fur, fur_dark, inner (ear), eyes ('open'|'none'). #}
  <g class="ears">
    <path d="M30 46 L34 12 L56 32 Z" fill="{{ fur }}" stroke="#1b1b1b" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M90 46 L86 12 L64 32 Z" fill="{{ fur }}" stroke="#1b1b1b" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M36 38 L37 20 L49 32 Z" fill="{{ inner }}"/>
    <path d="M84 38 L83 20 L71 32 Z" fill="{{ inner }}"/>
  </g>
  <ellipse cx="60" cy="56" rx="33" ry="28" fill="{{ fur }}" stroke="#1b1b1b" stroke-width="2.5"/>
  {% if fur_dark %}
  <path d="M52 30 L54 42 M60 29 L60 42 M68 30 L66 42" stroke="{{ fur_dark }}" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M28 56 L37 57 M29 63 L37 62 M92 56 L83 57 M91 63 L83 62" stroke="{{ fur_dark }}" stroke-width="3" stroke-linecap="round"/>
  {% endif %}
  <ellipse cx="60" cy="68" rx="14" ry="9" fill="#fff" opacity="0.85"/>
  {% if eyes != 'none' %}
  <ellipse cx="47" cy="53" rx="4.2" ry="5" fill="#1b1b1b"/>
  <ellipse cx="73" cy="53" rx="4.2" ry="5" fill="#1b1b1b"/>
  <circle cx="48.3" cy="51.5" r="1.4" fill="#fff"/>
  <circle cx="74.3" cy="51.5" r="1.4" fill="#fff"/>
  <path d="M39 43 L54 47" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
  <path d="M81 43 L66 47" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
  {% endif %}
  <path d="M56 63 L64 63 L60 67.5 Z" fill="#e58a9a" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M60 67.5 L60 71 M53 72 L67 72" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 66 L20 62 M44 70 L21 72 M76 66 L100 62 M76 70 L99 72" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <g class="hat">
    <ellipse cx="60" cy="31" rx="38" ry="7" fill="#2b2b2b"/>
    <path d="M38 31 C38 14 44 9 60 9 C76 9 82 14 82 31 Z" fill="#3a3a3a"/>
    <rect x="38.5" y="22" width="43" height="7" fill="#0033A0"/>
    <rect x="62" y="13" width="17" height="10" rx="1" fill="#fff" stroke="#1b1b1b" stroke-width="0.8" transform="rotate(8 70 18)"/>
    <text x="70.5" y="20.5" font-size="5.2" font-family="Georgia, serif" font-weight="700" text-anchor="middle" fill="#0033A0" transform="rotate(8 70 18)">PRESS</text>
  </g>
