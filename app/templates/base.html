<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lexington Sports Wire{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/" class="brand">🏈 Lexington Sports Wire</a>
    <form action="/search" method="get" class="search">
      <input type="search" name="q" placeholder="Find a player or team" value="{{ q|default('') }}" aria-label="Search">
      <button type="submit">Go</button>
    </form>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
