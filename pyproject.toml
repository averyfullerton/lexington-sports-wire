[project]
name = "lexington-sports-wire"
version = "0.1.0"
description = "A kid-friendly NFL reader at a first-grade reading level"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.55.1",
    "parallel-web>=1.3.7",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = []
